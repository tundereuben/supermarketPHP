<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Database - Admin - Supermarket@Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        secondary: '#047857',
                        accent: '#F97316',
                        dark: '#1F2937'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-dark text-gray-400 flex flex-col justify-between p-5 border-r border-gray-800 md:sticky md:top-0 md:h-screen z-40">
            <div class="space-y-8">
                <div class="flex items-center space-x-2 px-2">
                    <div class="bg-primary p-2 rounded-lg text-white"><i class="fas fa-sliders text-lg"></i></div>
                    <span class="text-2xl font-bold text-white tracking-tight">Admin<span class="text-primary">@Home</span></span>
                </div>
                <nav class="space-y-1.5 flex flex-col">
                    <a href="admin-dashboard.html" class="flex items-center space-x-3 hover:bg-gray-800 hover:text-white p-3 rounded-xl font-medium transition">
                        <i class="fas fa-chart-pie w-5 text-center"></i><span>Dashboard</span>
                    </a>
                    <a href="admin-orders.html" class="flex items-center space-x-3 hover:bg-gray-800 hover:text-white p-3 rounded-xl font-medium transition">
                        <i class="fas fa-cart-shopping w-5 text-center"></i><span>Orders Control</span>
                    </a>
                    <a href="admin-products.html" class="flex items-center space-x-3 hover:bg-gray-800 hover:text-white p-3 rounded-xl font-medium transition">
                        <i class="fas fa-boxes-stacked w-5 text-center"></i><span>Inventory Catalog</span>
                    </a>
                    <a href="admin-subscriptions.html" class="flex items-center space-x-3 hover:bg-gray-800 hover:text-white p-3 rounded-xl font-medium transition">
                        <i class="fas fa-basket-shopping w-5 text-center"></i><span>Food Baskets</span>
                    </a>
                    <a href="admin-customers.html" class="flex items-center space-x-3 bg-primary text-white p-3 rounded-xl font-bold transition">
                        <i class="fas fa-users w-5 text-center"></i><span>Customers DB</span>
                    </a>
                </nav>
            </div>
            <div class="border-t border-gray-800 pt-4 px-2 mt-6 flex items-center justify-between text-xs font-semibold">
                <div class="flex items-center space-x-2">
                    <div class="h-7 w-7 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold">A</div>
                    <span class="text-gray-300">Manager Terminal</span>
                </div>
                <a href="index.html" class="text-red-400 hover:text-red-500 transition"><i class="fas fa-power-off text-sm"></i></a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 sticky top-0 z-30">
                <div class="text-sm font-semibold text-gray-500">Customer Management</div>
                <div class="flex items-center space-x-4">
                    <button class="bg-primary text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-secondary transition">
                        <i class="fas fa-user-plus mr-2"></i>New Customer
                    </button>
                </div>
            </header>

            <main class="p-6">
                <!-- Filters & Search -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="md:col-span-2 relative">
                        <input type="text" placeholder="Search by name, email or phone..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary">
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                    </div>
                    <select class="bg-white border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option>Location: All</option>
                        <option>Lagos Island</option>
                        <option>Ikeja</option>
                        <option>Lekki</option>
                        <option>Abuja</option>
                    </select>
                    <select class="bg-white border border-gray-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option>Type: All Users</option>
                        <option>Active Subscribers</option>
                        <option>Standard Users</option>
                    </nav>
                </div>

                <!-- Customers Table -->
                <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b border-gray-100">
                            <tr class="text-gray-500 font-bold text-xs uppercase tracking-widest">
                                <th class="p-5">Customer Info</th>
                                <th class="p-5">Location</th>
                                <th class="p-5">Join Date</th>
                                <th class="p-5">Total Spend</th>
                                <th class="p-5 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-50">
                            <!-- Customer 1 -->
                            <tr class="hover:bg-gray-50/50 transition">
                                <td class="p-5 flex items-center space-x-4">
                                    <div class="h-10 w-10 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-sm">TF</div>
                                    <div>
                                        <div class="font-bold text-gray-900 text-sm">Tunde Faro</div>
                                        <div class="text-[11px] text-gray-400">tunde@faro.com • +234 803...</div>
                                    </div>
                                </td>
                                <td class="p-5 text-sm text-gray-600">Lagos Island</td>
                                <td class="p-5 text-sm text-gray-500">Jan 12, 2026</td>
                                <td class="p-5 text-sm font-bold text-gray-900">₦240,500</td>
                                <td class="p-5 text-right text-gray-400">
                                    <button class="hover:text-primary transition mx-2"><i class="fas fa-envelope"></i></button>
                                    <button class="hover:text-secondary transition mx-2"><i class="fas fa-edit"></i></button>
                                </td>
                            </tr>
                            <!-- Customer 2 -->
                            <tr class="hover:bg-gray-50/50 transition">
                                <td class="p-5 flex items-center space-x-4">
                                    <div class="h-10 w-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">CO</div>
                                    <div>
                                        <div class="font-bold text-gray-900 text-sm">Chioma Okeke</div>
                                        <div class="text-[11px] text-gray-400">chioma@mail.com • +234 701...</div>
                                    </div>
                                </td>
                                <td class="p-5 text-sm text-gray-600">Ikeja, Lagos</td>
                                <td class="p-5 text-sm text-gray-500">Feb 05, 2026</td>
                                <td class="p-5 text-sm font-bold text-gray-900">₦185,000</td>
                                <td class="p-5 text-right text-gray-400">
                                    <button class="hover:text-primary transition mx-2"><i class="fas fa-envelope"></i></button>
                                    <button class="hover:text-secondary transition mx-2"><i class="fas fa-edit"></i></button>
                                </td>
                            </tr>
                            <!-- Customer 3 -->
                            <tr class="hover:bg-gray-50/50 transition">
                                <td class="p-5 flex items-center space-x-4">
                                    <div class="h-10 w-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-sm">BA</div>
                                    <div>
                                        <div class="font-bold text-gray-900 text-sm">Bose Adewale</div>
                                        <div class="text-[11px] text-gray-400">bose@web.com • +234 902...</div>
                                    </div>
                                </td>
                                <td class="p-5 text-sm text-gray-600">Lekki, Lagos</td>
                                <td class="p-5 text-sm text-gray-500">Mar 19, 2026</td>
                                <td class="p-5 text-sm font-bold text-gray-900">₦62,100</td>
                                <td class="p-5 text-right text-gray-400">
                                    <button class="hover:text-primary transition mx-2"><i class="fas fa-envelope"></i></button>
                                    <button class="hover:text-secondary transition mx-2"><i class="fas fa-edit"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
