<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Wishlist Items - Supermarket@Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        secondary: '#047857',
                        accent: '#F97316',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Sticky Navigation header shared framework template -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="bg-primary p-2 rounded-lg"><i class="fas fa-shopping-basket text-white text-xl"></i></div>
                <span class="text-2xl font-bold text-gray-900">Supermarket<span class="text-primary">@Home</span></span>
            </a>
            <div class="text-sm font-semibold text-gray-600">
                <a href="dashboard.html" class="hover:text-primary"><i class="fas fa-arrow-left mr-2"></i>Back to Account</a>
            </div>
        </div>
    </header>

    <!-- Wishlist saved products main area -->
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Your Wishlist</h1>
        <p class="text-gray-500 text-sm mb-8">You have <span class="font-bold text-gray-900">3 products</span> stored inside your private wishlist tracker.</p>

        <!-- Product Cards Grid Layout Module for saved components -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Item 1: Tomatoes -->
            <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm relative group">
                <button class="absolute top-4 right-4 text-red-500 hover:text-gray-300 transition z-10"><i class="fas fa-heart text-lg"></i></button>
                <div class="block mb-4 overflow-hidden rounded-xl h-44 bg-gray-50">
                    <img src="https://images.unsplash.com/photo-1550989460-0adf9ea622e2?auto=format&fit=crop&q=80&w=400" class="w-full h-full object-cover">
                </div>
                <div class="space-y-2">
                    <h3 class="font-bold text-gray-900 text-base">Fresh Roma Tomatoes (1kg)</h3>
                    <div class="text-lg font-black text-gray-900">₦2,500</div>
                    
                    <div class="pt-2 flex space-x-2">
                        <button class="flex-1 bg-primary hover:bg-secondary text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                            <i class="fas fa-shopping-cart"></i><span>Move to Cart</span>
                        </button>
                        <button class="border border-gray-200 text-gray-400 p-2.5 rounded-xl hover:text-red-500 hover:bg-red-50 transition text-xs" title="Remove Item"><i class="far fa-trash-can"></i></button>
                    </div>
                </div>
            </div>

            <!-- Item 2: Cooking Oil -->
            <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm relative group">
                <button class="absolute top-4 right-4 text-red-500 hover:text-gray-300 transition z-10"><i class="fas fa-heart text-lg"></i></button>
                <div class="block mb-4 overflow-hidden rounded-xl h-44 bg-gray-50">
                    <img src="https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&q=80&w=400" class="w-full h-full object-cover">
                </div>
                <div class="space-y-2">
                    <h3 class="font-bold text-gray-900 text-base">Vegetable Cooking Oil (3L)</h3>
                    <div class="text-lg font-black text-gray-900">₦8,900</div>
                    
                    <div class="pt-2 flex space-x-2">
                        <button class="flex-1 bg-primary hover:bg-secondary text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                            <i class="fas fa-shopping-cart"></i><span>Move to Cart</span>
                        </button>
                        <button class="border border-gray-200 text-gray-400 p-2.5 rounded-xl hover:text-red-500 hover:bg-red-50 transition text-xs"><i class="far fa-trash-can"></i></button>
                    </div>
                </div>
            </div>

            <!-- Item 3: Basmati Rice -->
            <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm relative group">
                <button class="absolute top-4 right-4 text-red-500 hover:text-gray-300 transition z-10"><i class="fas fa-heart text-lg"></i></button>
                <div class="block mb-4 overflow-hidden rounded-xl h-44 bg-gray-50">
                    <img src="https://images.unsplash.com/photo-1523472721958-978152f4d69b?auto=format&fit=crop&q=80&w=400" class="w-full h-full object-cover">
                </div>
                <div class="space-y-2">
                    <h3 class="font-bold text-gray-900 text-base">Basmati Premium Rice (5kg)</h3>
                    <div class="text-lg font-black text-gray-900">₦12,500</div>
                    
                    <div class="pt-2 flex space-x-2">
                        <button class="flex-1 bg-primary hover:bg-secondary text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center space-x-2">
                            <i class="fas fa-shopping-cart"></i><span>Move to Cart</span>
                        </button>
                        <button class="border border-gray-200 text-gray-400 p-2.5 rounded-xl hover:text-red-500 hover:bg-red-50 transition text-xs"><i class="far fa-trash-can"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center mt-20">
        <p>&copy; 2026 Supermarket@Home. Wishlist Vault UX Card Components Template.</p>
    </footer>
</body>
</html>
